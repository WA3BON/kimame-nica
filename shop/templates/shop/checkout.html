{% extends 'core/base.html' %}
{% load static %}

{% block title %}!KiMame¡レジに進む{% endblock %}

{% block content %}
<section class="bg-black/90 flex flex-col items-center justify-center py-20 px-6 text-[#9e7b3b]">
  <div class="backdrop-blur-md rounded-3xl shadow-xl max-w-2xl w-full p-10"
       style="background-image: url('{% static 'core/images/texture_Pblack.jpg' %}'); background-repeat: repeat; background-size: auto;">
    <h2 class="text-3xl font-bold text-center mb-6">お届け先情報</h2>
    <p class="text-center mb-8">確認後、決済ページへ進みます。</p>

    <form action="{% url 'shop:checkout' %}" method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="py-2">
        <label for="{{ field.id_for_label }}" class="block mb-1 font-semibold">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <p class="text-red-400 text-sm mt-1">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
      {% endfor %}
      <div class="text-center py-10">
        <button type="submit"
          class="px-6 py-2 bg-[#9e7b3b] text-black rounded-xl font-semibold text-center border border-transparent hover:bg-black hover:text-[#9e7b3b] hover:border-[#9e7b3b] transition">
          お支払いへ進む
        </button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
